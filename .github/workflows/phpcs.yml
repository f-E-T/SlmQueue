name: "PHPCS"

on:
    pull_request:
        paths:
            - "**.php"
            - "phpcs.xml"
            - "composer.json"
            - ".github/workflows/phpcs.yml"

jobs:
    phpcs:
        runs-on: "ubuntu-latest"
        steps:
            - name: "Checkout"
              uses: "actions/checkout@v7"

            - name: "Install PHP"
              uses: "shivammathur/setup-php@v2"
              with:
                  php-version: "8.5"

            - name: "Install dependencies with Composer"
              uses: "ramsey/composer-install@v4"

            - name: "Run PHPCS"
              run: "composer cs-check"
